<!DOCTYPE html>
<html>
<head>
  <title>Shopping List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .reg-label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .reg-input,
    .search-input,
    .item-input {
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .reg-input,
    .search-input {
      width: 100%;
      margin-bottom: 10px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .item-input {
      flex: 1;
      min-width: 0;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn {
      background: #222;
      color: white;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      background: #eee;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-name {
      flex: 1;
      text-align: left;
      word-break: break-word;
    }

    .quantity {
      width: 55px;
      padding: 8px;
      text-align: center;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    .qty-btn {
      padding: 8px 11px;
    }

    .delete-btn {
      padding: 8px 10px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🛒 My Shopping List</h1>

    <label class="reg-label" for="regNumber">
      Registration Number
    </label>

    <input
      class="reg-input"
      id="regNumber"
      type="text"
      placeholder="Enter registration number"
    >2023030213492

    <input
      class="search-input"
      id="search"
      type="text"
      placeholder="🔍 Search items"
      oninput="searchItems()"
    >

    <div class="add-row">
      <input
        class="item-input"
        id="item"
        type="text"
        placeholder="Enter an item"
      >

      <button class="add-btn" onclick="addItem()">
        Add
      </button>
    </div>

    <ul id="list"></ul>

  </div>

  <script>

    function addItem() {

      const input = document.getElementById("item");
      const item = input.value.trim();

      if (item === "") {
        return;
      }

      const li = document.createElement("li");

      const name = document.createElement("span");
      name.className = "item-name";
      name.textContent = item;

      const minus = document.createElement("button");
      minus.className = "qty-btn";
      minus.textContent = "−";
      minus.onclick = function() {
        quantity.value = Math.max(1, Number(quantity.value) - 1);
      };

      const quantity = document.createElement("input");
      quantity.className = "quantity";
      quantity.type = "number";
      quantity.min = "1";
      quantity.value = "1";

      const plus = document.createElement("button");
      plus.className = "qty-btn";
      plus.textContent = "+";
      plus.onclick = function() {
        quantity.value = Number(quantity.value) + 1;
      };

      const remove = document.createElement("button");
      remove.className = "delete-btn";
      remove.textContent = "❌";
      remove.onclick = function() {
        li.remove();
      };

      li.appendChild(name);
      li.appendChild(minus);
      li.appendChild(quantity);
      li.appendChild(plus);
      li.appendChild(remove);

      document.getElementById("list").appendChild(li);

      input.value = "";
      input.focus();
    }

    function searchItems() {

      const search =
        document.getElementById("search").value.toLowerCase();

      const items =
        document.querySelectorAll("#list li");

      items.forEach(function(item) {

        const name =
          item.querySelector(".item-name").textContent.toLowerCase();

        if (name.includes(search)) {
          item.style.display = "flex";
        } else {
          item.style.display = "none";
        }

      });
    }

  </script>

</body>
</html>
