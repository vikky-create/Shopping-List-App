<!DOCTYPE html>
<html>
<head>
  <title>Shopping List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      padding: 12px;
      width: 65%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      background: #eee;
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🛒 My Shopping List</h1>

    <input id="item" type="text" placeholder="Enter an item">
    <button onclick="addItem()">Add</button>

    <ul id="list"></ul>
  </div>

  <script>
    function addItem() {
      const input = document.getElementById("item");
      const item = input.value.trim();

      if (item === "") return;

      const li = document.createElement("li");
      li.innerHTML = item + ' <button onclick="this.parentElement.remove()">❌</button>';

      document.getElementById("list").appendChild(li);
      input.value = "";
    }
  </script>
</body>
</html>
